<header class="header">
    <div class="header__left">
        <img src="Vetline-Photoroom.png" alt="Vetline Logo" class="header__logo" routerLink="/inicio">
        <nav class="header__nav">
            <a routerLink="/inicio" class="header__link">Tienda</a>
        </nav>
    </div>
    <div class="header__right">
        <div class="header__cart-container">
            <i class="bi bi-cart2 header__cart-icon" routerLink="/carrito"></i>
            @if ((cartCount$ | async) ?? 0; as count) {
            @if (count > 0) {
            <span class="header__cart-badge">{{ count }}</span>
            }
            }
        </div>
        <i class="bi bi-box-arrow-right header__exit-icon" (click)="onLogout()"></i>
    </div>
</header>
