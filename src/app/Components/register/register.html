<div class="c-register">
    <div class="c-register__container">
        <div class="c-register__header">
            <h1 class="c-register__title">Registro</h1>
        </div>

        <form class="c-register__form" (ngSubmit)="onRegister()">
            @if (errorMessage) {
            <div class="c-register__error">
                {{ errorMessage }}
            </div>
            }

            <div class="c-register__field">
                <label class="c-register__label" for="name">Nombre: *</label>
                <input [(ngModel)]="registerData.name" name="name" id="name" class="c-register__input"
                    #nameInput="ngModel" placeholder="Juan Pérez" required>

            </div>
            @if(nameInput.invalid && nameInput.touched){
            <p class="c-register__error-message">El nombre es obligatorio</p>
            }

            <div class="c-register__field">
                <label class="c-register__label" for="email">Email: *</label>
                <input type="email" [(ngModel)]="registerData.email" name="email" id="email" class="c-register__input"
                    #emailInput="ngModel" placeholder="usuario@example.com" required>
            </div>
            @if(emailInput.invalid && emailInput.touched){
            <p class="c-register__error-message">El email es obligatorio</p>
            }

            <div class="c-register__field">
                <label class="c-register__label" for="password">Contraseña: *</label>
                <input type="password" [(ngModel)]="registerData.password" name="password" id="password"
                    #passwordInput="ngModel" class="c-register__input" placeholder="••••••••" required>
            </div>
            @if(passwordInput.invalid && passwordInput.touched){
            <p class="c-register__error-message">La contraseña es obligatoria</p>
            }

            <div class="c-register__field">
                <label class="c-register__label" for="phone">Teléfono (opcional):</label>
                <input type="tel" [(ngModel)]="registerData.phone" name="phone" id="phone" class="c-register__input"
                    placeholder="+34 600 123 456">
            </div>

            <button type="submit" class="c-register__btn" [disabled]="isLoading">
                {{ isLoading ? 'Registrando...' : 'Registrarse' }}
            </button>
        </form>
    </div>
</div>
