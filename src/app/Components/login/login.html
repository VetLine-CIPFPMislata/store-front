<div class="login">
  <div class="login__container">
    <div class="login__header">
      <img src="Vetline-Photoroom.png" alt="Vetline Logo" class="login__logo">
      <h1 class="login__title">Inicio de Sesión</h1>
    </div>

    <form class="login__form" (ngSubmit)="onLogin()">
      @if (errorMessage) {
        <div class="login__error">
          {{ errorMessage }}
        </div>
      }

      <div class="login__field">
        <label class="login__label" for="email">Email:</label>
        <input 
          [(ngModel)]="credentials.email"
          name="email"
          id="email"
          class="login__input"
          placeholder="admin@example.com"
          required>
      </div>

      <div class="login__field">
        <label class="login__label" for="password">Contraseña:</label>
        <input 
          type="password"
          [(ngModel)]="credentials.password"
          name="password"
          id="password"
          class="login__input"
          placeholder="••••••••"
          required>
      </div>

      <button 
        type="submit" 
        class="login__btn"
        [disabled]="isLoading">
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>
